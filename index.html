<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>犬勤怠</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="犬勤怠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF3EF;
    --card: #FFFFFF;
    --ink: #1B2B26;
    --muted: #5E7068;
    --line: #D5DFD9;
    --leaf: #2F6B4F;
    --leaf-ink: #FFFFFF;
    --biscuit: #C9892F;
    --alert: #B4432F;
    --apricot: #EDBF8C;
    --apricot-light: #F6D9B5;
    --apricot-dark: #D9A36A;
    --dog-dark: #3A2A22;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121C18; --card: #1B2924; --ink: #E9F1EC; --muted: #93A89D;
      --line: #2C3D36; --leaf: #6FCB9A; --leaf-ink: #0E1A15; --biscuit: #E8B04A; --alert: #F08A74;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121C18; --card: #1B2924; --ink: #E9F1EC; --muted: #93A89D;
    --line: #2C3D36; --leaf: #6FCB9A; --leaf-ink: #0E1A15; --biscuit: #E8B04A; --alert: #F08A74;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 56px; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--biscuit); outline-offset: 2px; }

  /* Hero */
  .hero { text-align: center; padding: 4px 0 16px; }
  .dog { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto 4px; overflow: visible; }
  .dog .walk, .dog .sleep { display: none; }
  .dog[data-state="walk"] .walk { display: block; }
  .dog[data-state="sleep"] .sleep { display: block; }

  .dog .ground { stroke: var(--line); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 18 22; animation: ground 0.7s linear infinite; }
  @keyframes ground { to { stroke-dashoffset: 40; } }
  .dog .bob { animation: bob 0.7s ease-in-out infinite; }
  @keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-3px); } }
  .dog .leg { animation: swing 0.7s ease-in-out infinite alternate; }
  .dog .l1 { transform-origin: 84px 124px; }
  .dog .l2 { transform-origin: 104px 124px; animation-direction: alternate-reverse; }
  .dog .l3 { transform-origin: 146px 124px; animation-direction: alternate-reverse; }
  .dog .l4 { transform-origin: 166px 124px; }
  @keyframes swing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .dog .tailpom { transform-origin: 66px 100px; animation: wag 0.5s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  .dog .breath { transform-origin: 110px 160px; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.035); } }
  .dog .zz { animation: zz 3.2s ease-in-out infinite; }
  .dog .zz2 { animation-delay: 1.2s; }
  @keyframes zz { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .dog * { animation: none !important; } .dog .zz { opacity: 1; } }

  .status { font-size: 20px; font-weight: 900; margin: 0; }
  .clock { font-size: 52px; font-weight: 900; line-height: 1.15; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px auto 0; max-width: 240px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--leaf); border-radius: 999px; transition: width .4s; }

  .actions { margin: 8px 0 24px; }
  .btn {
    border: 2px solid var(--leaf); background: transparent; color: var(--leaf);
    border-radius: 16px; padding: 16px 8px; font-weight: 900; font-size: 18px; cursor: pointer; min-height: 56px; width: 100%;
  }
  .btn.primary { background: var(--leaf); color: var(--leaf-ink); }
  .btn:active { transform: translateY(1px); }

  .month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month-head h2 { margin: 0; font-size: 20px; font-weight: 900; }
  .nav { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; }
  .totals div { padding: 12px 8px; text-align: center; }
  .totals div + div { border-left: 1px solid var(--line); }
  .totals .n { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .totals .l { font-size: 12px; color: var(--muted); }

  .days { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .day { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
  .days li:last-child { border-bottom: 0; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 900; }
  .day-head small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
  .day-head .tot { font-variant-numeric: tabular-nums; }
  .sess { display: flex; justify-content: space-between; width: 100%; padding: 8px 0; border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sess:hover { color: var(--ink); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .add { margin-top: 12px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .scrim.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; font-weight: 900; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 17px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sheet-actions { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; margin-top: 8px; }
  .sheet-actions .btn { padding: 12px 14px; font-size: 16px; }
  .btn.danger { border-color: var(--alert); color: var(--alert); }

  .settings { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
  .settings h2 { font-size: 16px; font-weight: 900; margin: 0 0 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>

    <p class="status" id="status">おやすみ中</p>
    <p class="clock" id="clock">0:00</p>
    <p class="sub" id="sub">&nbsp;</p>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="btnToggle">勉強開始</button>
  </div>

  <section>
    <div class="month-head">
      <button class="nav" id="prev" aria-label="前の月">◀</button>
      <h2 id="monthTitle"></h2>
      <button class="nav" id="next" aria-label="次の月">▶</button>
    </div>
    <div class="totals">
      <div><div class="n" id="tDays">0</div><div class="l">勉強した日</div></div>
      <div><div class="n" id="tHours">0:00</div><div class="l">合計時間</div></div>
      <div><div class="n" id="tAvg">0:00</div><div class="l">1日の平均</div></div>
    </div>
    <ul class="days" id="days"></ul>
    <button class="btn add" id="btnAdd">日付を指定して記録を追加</button>
  </section>

  <section class="settings">
    <h2>設定</h2>
    <div class="field"><label for="setGoal">1日の目標(時間)</label><input id="setGoal" type="number" min="0" max="24" step="0.5" inputmode="decimal"></div>
    <p class="sub">データはこの端末のブラウザにだけ保存されます。</p>
  </section>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">記録を編集</h3>
    <div class="field"><label for="fDate">日付</label><input id="fDate" type="date"></div>
    <div class="two">
      <div class="field"><label for="fStart">開始</label><input id="fStart" type="time"></div>
      <div class="field"><label for="fEnd">終了</label><input id="fEnd" type="time"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn danger" id="fDel">削除</button>
      <button class="btn" id="fCancel">閉じる</button>
      <button class="btn primary" id="fSave">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var KEY = "inu-benkyo:v1";
  // records: { "YYYY-MM-DD": [ {start:"HH:MM", end:"HH:MM", min:Number} ] }
  var state = { records: {}, goal: 2, active: null };
  var view = new Date(); view.setDate(1);
  var $ = function (id) { return document.getElementById(id); };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          state.records = d.records || {};
          state.goal = Number(d.goal) >= 0 ? Number(d.goal) : 2;
          state.active = d.active && typeof d.active.ts === "number" ? d.active : null;
        }
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast("この端末では保存できませんでした"); }
  }

  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function dkey(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  function hm(d) { return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  function toMin(s) { var a = s.split(":"); return Number(a[0]) * 60 + Number(a[1]); }
  function fmt(min) { var m = Math.max(0, Math.round(min)); return Math.floor(m / 60) + ":" + p2(m % 60); }
  function fmtSec(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 3600) + ":" + p2(Math.floor(sec % 3600 / 60)) + ":" + p2(sec % 60); }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function dayTotal(key) {
    return (state.records[key] || []).reduce(function (a, s) { return a + (s.min || 0); }, 0);
  }
  function addSession(key, s) {
    (state.records[key] = state.records[key] || []).push(s);
    state.records[key].sort(function (a, b) { return a.start < b.start ? -1 : 1; });
  }

  function renderHero() {
    var now = new Date(), dog = $("dog");
    var todayMin = dayTotal(dkey(now));
    var goalMin = state.goal * 60;
    if (state.active) {
      var sec = (Date.now() - state.active.ts) / 1000;
      dog.dataset.state = "walk";
      $("status").textContent = "勉強中";
      $("clock").textContent = fmtSec(sec);
      $("sub").textContent = hm(new Date(state.active.ts)) + " に開始・今日はここまで " + fmt(todayMin);
      $("btnToggle").textContent = "勉強終了";
      $("btnToggle").className = "btn";
      todayMin += sec / 60;
    } else {
      dog.dataset.state = "sleep";
      $("status").textContent = "おやすみ中";
      $("clock").textContent = fmt(todayMin);
      $("sub").textContent = todayMin ? "今日の勉強時間" : "今日はまだ勉強していません";
      $("btnToggle").textContent = "勉強開始";
      $("btnToggle").className = "btn primary";
    }
    var show = goalMin > 0;
    $("barWrap").style.display = show ? "block" : "none";
    if (show) $("bar").style.width = Math.min(100, todayMin / goalMin * 100) + "%";
  }

  function renderMonth() {
    var y = view.getFullYear(), m = view.getMonth();
    $("monthTitle").textContent = y + "年" + (m + 1) + "月";
    var days = new Date(y, m + 1, 0).getDate(), total = 0, count = 0, items = [];
    for (var d = days; d >= 1; d--) {
      var key = y + "-" + p2(m + 1) + "-" + p2(d), list = state.records[key];
      if (!list || !list.length) continue;
      var t = dayTotal(key); total += t; count++;
      items.push({ key: key, d: d, list: list, t: t });
    }
    $("tDays").textContent = count;
    $("tHours").textContent = fmt(total);
    $("tAvg").textContent = fmt(count ? total / count : 0);
    var ul = $("days"); ul.innerHTML = "";
    if (!items.length) {
      var li = document.createElement("li"); li.className = "empty";
      li.textContent = "この月の記録はまだありません。勉強開始を押してみましょう。";
      ul.appendChild(li); return;
    }
    items.forEach(function (it) {
      var dow = new Date(y, m, it.d).getDay();
      var li = document.createElement("li"); li.className = "day";
      var head = document.createElement("div"); head.className = "day-head";
      head.innerHTML = "<span>" + (m + 1) + "/" + it.d + "<small>" + WD[dow] + "曜</small></span><span class=\"tot\">" + fmt(it.t) + "</span>";
      li.appendChild(head);
      it.list.forEach(function (s, i) {
        var b = document.createElement("button"); b.className = "sess";
        b.dataset.key = it.key; b.dataset.i = i;
        b.innerHTML = "<span>" + s.start + " – " + s.end + "</span><span>" + fmt(s.min) + "</span>";
        li.appendChild(b);
      });
      ul.appendChild(li);
    });
  }

  function renderAll() { renderHero(); renderMonth(); }

  $("btnToggle").addEventListener("click", function () {
    if (state.active) {
      var start = new Date(state.active.ts), now = new Date();
      var min = Math.max(1, Math.round((now - start) / 60000));
      addSession(dkey(start), { start: hm(start), end: hm(now), min: min });
      state.active = null; save(); renderAll(); toast("記録しました(" + fmt(min) + ")");
    } else {
      state.active = { ts: Date.now() }; save(); renderAll();
    }
  });
  $("prev").addEventListener("click", function () { view.setMonth(view.getMonth() - 1); renderMonth(); });
  $("next").addEventListener("click", function () { view.setMonth(view.getMonth() + 1); renderMonth(); });

  // Edit sheet
  var editing = null; // {key, i}
  function openSheet(key, i) {
    var s = key ? state.records[key][i] : null;
    editing = key ? { key: key, i: i } : null;
    $("sheetTitle").textContent = key ? "記録を編集" : "記録を追加";
    $("fDate").value = key || dkey(new Date());
    $("fStart").value = s ? s.start : "";
    $("fEnd").value = s ? s.end : "";
    $("fDel").style.visibility = key ? "visible" : "hidden";
    $("scrim").classList.add("open");
    $("fStart").focus();
  }
  function closeSheet() { $("scrim").classList.remove("open"); }
  $("days").addEventListener("click", function (e) {
    var b = e.target.closest(".sess"); if (b) openSheet(b.dataset.key, Number(b.dataset.i));
  });
  $("btnAdd").addEventListener("click", function () { openSheet(null); });
  $("fCancel").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", function (e) { if (e.target === $("scrim")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  $("fSave").addEventListener("click", function () {
    var k = $("fDate").value, s = $("fStart").value, en = $("fEnd").value;
    if (!k) { toast("日付を選んでください"); return; }
    if (!s || !en) { toast("開始と終了の時刻を入力してください"); return; }
    var a = toMin(s), b = toMin(en); if (b < a) b += 1440;
    if (b === a) { toast("開始と終了が同じです"); return; }
    if (editing) {
      state.records[editing.key].splice(editing.i, 1);
      if (!state.records[editing.key].length) delete state.records[editing.key];
    }
    addSession(k, { start: s, end: en, min: b - a });
    save(); closeSheet();
    var d = k.split("-"); view = new Date(Number(d[0]), Number(d[1]) - 1, 1);
    renderAll(); toast("保存しました");
  });
  $("fDel").addEventListener("click", function () {
    if (!editing || !confirm("この記録を削除しますか?")) return;
    state.records[editing.key].splice(editing.i, 1);
    if (!state.records[editing.key].length) delete state.records[editing.key];
    save(); closeSheet(); renderAll(); toast("削除しました");
  });

  $("setGoal").addEventListener("change", function () {
    var v = Number(this.value);
    if (v >= 0 && v <= 24) { state.goal = v; save(); renderHero(); } else this.value = state.goal;
  });

  load();
  $("setGoal").value = state.goal;
  renderAll();
  setInterval(renderHero, 1000);
})();
</script>
